version = 1
default_target = "clipboard"
input_mode = "push_to_talk"

[audio]
profile = "responsive"

[hotkeys]
active_target = "option+space"

[stt]
# "parakeet" runs NVIDIA Parakeet TDT on the Apple Neural Engine, inside Miri
# itself. No Python, no network. This is the default.
provider = "parakeet"

# Cloud transcription is opt-in and configured in Settings > Speech, which also
# stores the API key in your Keychain. The key is never stored here.
# provider = "cloud"
# cloud_base_url = "https://api.groq.com/openai/v1"
# cloud_model = "whisper-large-v3-turbo"
# cloud_language = "en"
# cloud_prompt = "Codex, Miri, SwiftUI, AVFoundation"  # bias toward your jargon

# Point Miri at an agent CLI installed somewhere unusual (mise, asdf, volta).
# By default it searches your login shell's PATH, then the common prefixes.
# [agents]
# codex_path = "~/.local/share/mise/shims/codex"

[vad]
provider = "silero"
threshold = 0.5
minimum_silence_ms = 500

[tts]
# PocketTTS on CoreML, in-process. Voice models download on first use.
provider = "pocket-tts"
voice = "alba"
speak_agent_responses = true
agent_response_max_characters = 180

# Wake word is unavailable in this build: it ran inside the removed Python
# worker. Push to talk is the supported input mode.
[wakeword]
enabled = false

[[targets]]
id = "clipboard"
name = "Clipboard"
adapter = "clipboard"

# Add Codex conversations from Settings > Targets. Miri stores exact thread ID:
# [[targets]]
# id = "codex-project"
# name = "Codex – Project"
# adapter = "codex"
# working_directory = "/path/to/project"
# session = "thread-uuid"

# [[targets]]
# id = "hermes-project"
# name = "Hermes – Project"
# adapter = "hermes"
# endpoint = "http://127.0.0.1:8642"
# session = "hermes-session-id"
# Set HERMES_API_SERVER_KEY in Miri's launch environment when authentication is enabled.
