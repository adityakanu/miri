version = 1
default_target = "clipboard"
input_mode = "push_to_talk"

[hotkeys]
active_target = "option+space"

[stt]
# Parakeet is the only transcription backend exposed in 0.1.4. NVIDIA Parakeet
# TDT v3 runs inside Miri itself on CoreML, with the encoder on the Apple
# Neural Engine. No Python, no network after the one-time model download.
provider = "parakeet"

# Point Miri at an agent CLI installed somewhere unusual (mise, asdf, volta).
# By default it searches your login shell's PATH, then the common prefixes.
# [agents]
# codex_path = "~/.local/share/mise/shims/codex"

[vad]
provider = "silero"
threshold = 0.5
minimum_silence_ms = 500

[tts]
# PocketTTS on CoreML, in-process, English voice only. It runs at FluidAudio's
# default GPU-backed compute placement, not on the Neural Engine.
provider = "pocket-tts"
voice = "alba"
speak_agent_responses = true
agent_response_max_characters = 180

# Speech models are downloaded once from Hugging Face after a single explicit
# consent prompt covering about 1 GB in total: roughly 470 MB for Parakeet in
# ~/Library/Application Support/FluidAudio/Models, and roughly 520 MB for the
# PocketTTS voice in ~/.cache/fluidaudio/Models. Settings > Speech >
# Delete Models removes both.

[[targets]]
id = "clipboard"
name = "Clipboard"
adapter = "clipboard"

# Add Codex conversations from Settings > Targets. Miri stores exact thread ID.
# Codex is the live-validated adapter for 0.1.4.
# [[targets]]
# id = "codex-project"
# name = "Codex – Project"
# adapter = "codex"
# working_directory = "/path/to/project"
# session = "thread-uuid"

# Claude Code and Hermes adapters are experimental in 0.1.4.
#
# Hermes runs a single application process for all of its conversations, so
# Miri cannot find its sessions in the process table the way it does for Codex
# and Claude Code. Point it at the API server and Settings can list them — set
# this *before* adding a Hermes target, since discovery is what you build the
# target from.
# [hermes]
# endpoint = "http://127.0.0.1:8642"

# [[targets]]
# id = "hermes-project"
# name = "Hermes – Project"
# adapter = "hermes"
# endpoint = "http://127.0.0.1:8642"
# session = "hermes-session-id"
# Set HERMES_API_SERVER_KEY in Miri's launch environment when authentication is enabled.
