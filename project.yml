name: Miri
options:
  bundleIdPrefix: dev.miri
  deploymentTarget:
    macOS: "14.0"
# Speech runs on the Apple Neural Engine, which only exists on Apple Silicon.
# This must be project-wide so SwiftPM dependencies build arm64-only too.
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    VALID_ARCHS: arm64
packages:
  Miri:
    path: .
targets:
  Miri:
    type: application
    platform: macOS
    sources: [Sources/MiriApp]
    dependencies:
      - package: Miri
        product: MiriCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.miri.app
        PRODUCT_NAME: Miri
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Miri.entitlements
        GENERATE_INFOPLIST_FILE: NO
        # Speech runs on the Apple Neural Engine, which only exists on Apple
        # Silicon, so Miri is an arm64-only application.
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
schemes:
  MiriApp:
    build:
      targets:
        Miri: all
    run:
      config: Debug
    archive:
      config: Release
